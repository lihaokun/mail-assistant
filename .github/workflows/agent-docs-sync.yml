name: Agent docs sync

on:
  push:
    paths:
      - CLAUDE.md
      - AGENTS.md
      - .github/workflows/agent-docs-sync.yml
  pull_request:
    paths:
      - CLAUDE.md
      - AGENTS.md
      - .github/workflows/agent-docs-sync.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify CLAUDE.md and AGENTS.md are identical
        run: diff -u CLAUDE.md AGENTS.md
